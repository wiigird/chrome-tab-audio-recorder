<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1 id="heading"></h1>
        <button id="refreshTabs" class="icon-button" type="button">↻</button>
      </header>

      <label id="tabSelectLabel" for="tabSelect"></label>
      <select id="tabSelect"></select>
      <p id="tabHint"></p>

      <section class="status-card">
        <div id="statusDot" class="status-dot idle"></div>
        <div class="status-text">
          <span id="statusLabel"></span>
          <strong id="timer">00:00:00</strong>
        </div>
      </section>

      <p id="recordingTab" class="recording-tab"></p>

      <div class="controls">
        <button id="startButton" class="primary" type="button"></button>
        <button id="pauseButton" type="button" disabled></button>
        <button id="stopButton" class="danger" type="button" disabled></button>
      </div>

      <p id="message" role="status"></p>
      <footer id="saveLocation"></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
